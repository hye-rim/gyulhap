<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>결! 합!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:linear-gradient(180deg, #8a7cff 0%, #5f4fd8 55%, #3b2f9a 100%); font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff; touch-action:manipulation; }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #col { width:min(100%, 460px); display:flex; flex-direction:column; align-items:center; gap:8px; }
  #hud { display:flex; align-items:center; gap:6px; width:100%; font-variant-numeric:tabular-nums; color:var(--ink); }
  #hud .item { display:flex; align-items:center; gap:5px; white-space:nowrap; background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); padding:2px 12px; height:38px; }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; } #hud .item.you .value { color:#1f9d4a; } #hud .item.cpu .value { color:#e63946; }
  #hud .label { font-size:11px; color:var(--muted); } #hud .value { font-size:19px; }
  #hud .icons { margin-left:auto; } #hud button { background:#fff; border:3px solid var(--ink); color:var(--ink); width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink); }
  #wrap { position:relative; width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; }
  #bar { width:100%; height:10px; background:rgba(255,255,255,.2); border-radius:6px; overflow:hidden; } #barIn { height:100%; width:0; background:#4cd964; transition:width .1s linear; }
  #boardBox { position:relative; width:min(100%, calc(100dvh - 300px)); aspect-ratio:1; background:#2b1d52; border:4px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); padding:6px; }
  #board { display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(3, 1fr); gap:6px; width:100%; height:100%; }
  .card { position:relative; border:3px solid var(--ink); border-radius:12px; display:grid; place-items:center; cursor:pointer; font-family:inherit; padding:0; transition:transform .1s; box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .card.bg-black { background:#222; } .card.bg-gray { background:#8d8d94; } .card.bg-white { background:#f7f7f7; }
  .shape { width:52%; height:52%; border:2px solid rgba(0,0,0,.35); } .shape.circle { border-radius:50%; } .shape.square { border-radius:6px; } .shape.triangle { border:0; clip-path:polygon(50% 4%, 96% 92%, 4% 92%); }
  .shape.red { background:#ff3b3b; } .shape.yellow { background:#ffd23f; } .shape.blue { background:#2f7bff; }
  .num { position:absolute; left:5px; top:2px; font-size:13px; color:#fff; text-shadow:0 1px 0 #000, 0 0 3px #000; }
  .card.sel { transform:translateY(-4px) scale(1.04); outline:4px solid var(--pink); z-index:2; }
  .card.say { outline:4px solid #4cd964; } .card.dis { opacity:.6; cursor:default; }
  #msg { min-height:22px; font-size:15px; text-align:center; text-shadow:0 2px 0 rgba(0,0,0,.4); padding:0 6px; }
  #found { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; min-height:24px; font-size:13px; } #found span { background:rgba(255,255,255,.18); border-radius:10px; padding:1px 8px; }
  #tools { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #tools button { font:inherit; font-size:20px; color:var(--ink); background:var(--yellow); border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); padding:7px 24px; cursor:pointer; }
  #tools button.sub { background:#fff; font-size:16px; padding:7px 16px; }
  #tools button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); } #tools button:disabled { opacity:.45; cursor:default; }
  #float { position:absolute; left:50%; top:30%; transform:translateX(-50%); font-size:34px; pointer-events:none; text-shadow:0 3px 0 var(--ink); opacity:0; z-index:30; } #float.show { animation:up 1s ease-out forwards; }
  @keyframes up { 0% { opacity:1; transform:translate(-50%,10px); } 100% { opacity:0; transform:translate(-50%,-40px); } }
  #overlay { position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px; text-align:center; padding:16px; background:rgba(43,29,82,.93); border-radius:12px; overflow-y:auto; touch-action:pan-y; }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(34px, 11vw, 46px); line-height:1.05; color:var(--yellow); } #overlay h2 { font-size:28px; }
  #overlay p { font-size:13.5px; line-height:1.6; } #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 16px; font-size:16px; } #overlay .stats dt { color:#d9c9ff; text-align:right; } #overlay .stats dd { text-align:left; }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  #overlay button { background:var(--yellow); color:var(--ink); font-size:19px; font-family:inherit; border:3px solid var(--ink); border-radius:999px; padding:8px 28px; box-shadow:0 5px 0 var(--ink); cursor:pointer; }
  #overlay button.sub { background:#fff; font-size:15px; padding:6px 20px; box-shadow:0 4px 0 var(--ink); } #overlay button small { display:block; font-size:11px; color:var(--muted); }
  #overlay .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  @media (max-width:420px) { #hud .label { display:none; } }
  @media (max-height:700px) { #col { gap:5px; } #overlay h1 { font-size:32px; } #overlay p { font-size:12px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="label">라운드</span><span class="value" id="roundN">1/10</span></div>
      <div class="item you"><span class="label">나</span><span class="value" id="myScore">0</span></div>
      <div class="item cpu"><span class="label">컴퓨터</span><span class="value" id="cpuScore">0</span></div>
      <div class="icons"><button id="muteBtn" title="소리 (M)">🔊</button></div>
    </div>
    <div id="wrap">
      <div id="bar"><div id="barIn"></div></div>
      <div id="boardBox"><div id="board"></div><div id="float"></div><div id="overlay"></div></div>
      <div id="msg"></div>
      <div id="found"></div>
      <div id="tools"><button id="callBtn">합!</button><button id="endBtn">결!</button><button id="passBtn" class="sub">넘기기</button></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
